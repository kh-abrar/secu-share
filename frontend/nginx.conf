# Caching per path. (Headers are all set at server level: in nginx, any add_header inside a
# location block silently discards the server-level ones, including the security headers.)
map $uri $cache_control {
  ~^/api/    "";                                      # the API sets its own
  ~^/assets/ "public, max-age=31536000, immutable"; # hashed build output
  default    "no-cache";
}

# Serves the built SPA and proxies /api to the API container, so the app and API share
# one origin (session cookies work with SameSite=Lax; no CORS needed).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Encrypted uploads: keep in sync with the API's MAX_FILE_SIZE (+ a little overhead)
  client_max_body_size 110m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control $cache_control always;

  location /api/ {
    proxy_pass http://api:4000;
    # One consistent set of security headers (set above) instead of duplicates
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;  # stream uploads straight through
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /assets/ {
    try_files $uri =404;
  }

  # Client-side routes
  location / {
    try_files $uri /index.html;
  }
}
